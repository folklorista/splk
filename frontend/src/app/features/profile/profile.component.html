<div class="profile-page">
  <div class="profile-header">
    <h1>Můj profil</h1>
  </div>

  @if (currentUser()) {
    <div class="profile-section">
      <h2>Osobní údaje</h2>

      <div class="profile-field">
        <div class="profile-field-label">Jméno a příjmení</div>
        <div class="profile-field-value">{{ fullName() }}</div>
        <div class="profile-field-hint">Vidí ho jen administrátor, změnit ho může jen on.</div>
      </div>

      <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="saveContact()">
        <label>
          Přezdívka
          <input type="text" formControlName="nickname" (input)="saved = false" />
          <span class="profile-field-hint">Pod tímto jménem vás vidí ostatní členové.</span>
          @if (contactForm.get('nickname')?.invalid && contactForm.get('nickname')?.touched) {
            <span class="contact-form__error">Přezdívka je povinná</span>
          }
        </label>

        <label>
          E-mail
          <input type="email" formControlName="email" autocomplete="email" (input)="saved = false" />
          @if (contactForm.get('email')?.invalid && contactForm.get('email')?.touched) {
            <span class="contact-form__error">Zadejte platný e-mail</span>
          }
        </label>

        <label>
          Telefon
          <input type="tel" formControlName="phone" autocomplete="tel" (input)="saved = false" />
        </label>

        <div class="contact-form__actions">
          <button
            type="submit"
            class="attendance-btn attendance-btn--active"
            [disabled]="contactForm.invalid || contactForm.pristine || isSaving"
          >
            {{ isSaving ? 'Ukládám…' : 'Uložit' }}
          </button>
          @if (saved) {
            <span class="contact-form__saved">✓ Uloženo</span>
          }
        </div>

        @if (saveError) {
          <span class="contact-form__error">{{ saveError }}</span>
        }
      </form>
    </div>

    <button class="logout-btn" (click)="logout()">Odhlásit se</button>
  }
</div>
