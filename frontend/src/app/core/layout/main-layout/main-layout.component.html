<div class="app-shell">
  <app-sidebar class="app-shell__sidebar" />
  <div class="app-shell__main">
    <header class="mobile-header">
      <a class="mobile-header__logo" routerLink="/app/dashboard" title="Přehled">
        <app-logo [height]="34" />
      </a>
      <div class="mobile-header__actions">
        <a class="header-action" routerLink="/app/search" title="Hledat" aria-label="Hledat">
          <app-icon name="search" [size]="22" />
        </a>
        <div class="header-menu">
          <button
            type="button"
            class="header-action"
            (click)="toggleHeaderMenu()"
            [attr.aria-expanded]="headerMenuOpen()"
            aria-haspopup="menu"
            aria-controls="header-menu-list"
            title="Další možnosti"
            aria-label="Další možnosti"
          >
            <app-icon name="menu" [size]="22" />
          </button>
          @if (headerMenuOpen()) {
            <div class="header-menu__list" id="header-menu-list" role="menu">
              @if (auth.currentUser(); as user) {
                <a class="header-menu__item" role="menuitem" routerLink="/app/profile">
                  <app-icon name="user" />
                  <span class="header-menu__label">
                    {{ user.name }}
                    <small>Můj profil</small>
                  </span>
                </a>
              }
              <a class="header-menu__item" role="menuitem" routerLink="/app/more">
                <app-icon name="menu" />
                <span class="header-menu__label">Všechna místa</span>
              </a>
              <a class="header-menu__item" role="menuitem" routerLink="/app/settings">
                <app-icon name="settings" />
                <span class="header-menu__label">Nastavení</span>
              </a>
              <div class="header-menu__version"><app-version-label /></div>
              <button type="button" class="header-menu__item header-menu__item--logout" role="menuitem" (click)="logout()">
                <app-icon name="logout" />
                <span class="header-menu__label">Odhlásit se</span>
              </button>
            </div>
          }
        </div>
      </div>
    </header>
    <div class="bordura bordura--mobile" aria-hidden="true"></div>
    <main class="app-shell__content">
      <app-demo-banner />
      <router-outlet />
    </main>
  </div>
  <app-bottom-nav class="app-shell__bottom-nav" />
</div>
