<div class="app-shell">
  <app-sidebar class="app-shell__sidebar" />
  <div class="app-shell__main">
    <header class="mobile-header">
      <a class="mobile-header__logo" routerLink="/app/dashboard" title="Přehled">
        <app-logo [height]="34" />
      </a>
      @if (auth.currentUser(); as user) {
        <a class="mobile-header__user" routerLink="/app/profile" title="Můj profil">{{ user.name }}</a>
      }
      <app-version-label />
      <a class="settings-link" routerLink="/app/search" title="Hledat" aria-label="Hledat">
        <app-icon name="search" [size]="18" />
      </a>
      <a class="settings-link" routerLink="/app/settings" title="Nastavení" aria-label="Nastavení">
        <app-icon name="settings" [size]="18" />
      </a>
      <a class="settings-link" routerLink="/app/more" title="Všechna místa" aria-label="Všechna místa">
        <app-icon name="menu" [size]="18" />
      </a>
      <button class="mobile-header__logout" (click)="logout()">Odhlásit se</button>
    </header>
    <div class="bordura bordura--mobile" aria-hidden="true"></div>
    <main class="app-shell__content">
      <app-demo-banner />
      <router-outlet />
    </main>
  </div>
  <app-bottom-nav class="app-shell__bottom-nav" />
</div>
