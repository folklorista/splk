<aside class="sidebar">
  <div class="sidebar__header">
    <span class="sidebar__logo">Folklorní soubor</span>
  </div>

  <nav class="sidebar__nav">
    @for (section of navSections(); track $index) {
      <div class="sidebar__nav-section">
        @if (section.label) {
          <div class="sidebar__nav-section-label">{{ section.label }}</div>
        }
        @for (item of section.items; track item.path) {
          <a
            class="sidebar__nav-item"
            [routerLink]="item.path"
            routerLinkActive="sidebar__nav-item--active"
          >
            <app-icon [name]="item.icon" />
            <span>{{ item.label }}</span>
            @if (item.badge) {
              <span class="sidebar__badge">{{ item.badge }}</span>
            }
          </a>
        }
      </div>
    }
  </nav>

  <div class="sidebar__footer">
    @if (auth.currentUser(); as user) {
      <a class="sidebar__user" routerLink="/app/profile" title="Můj profil">{{ user.name }}</a>
    }
    <button class="sidebar__logout" (click)="logout()">Odhlásit se</button>
    <app-version-label />
  </div>
</aside>
