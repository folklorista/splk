<main class="auth-page">
  <section class="card auth-card">
    <h1 class="auth-title">Krojařka <small>Vonica</small></h1>

    @if (mock) {
      <p class="notice notice-warn">
        Vývojová data bez serveru. Přihlaste se jako <strong>{{ mockLogin.email }}</strong>, heslo
        <strong>{{ mockLogin.password }}</strong>.
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>E-mail</span>
        <input type="email" formControlName="email" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Heslo</span>
        <input type="password" formControlName="password" autocomplete="current-password" required />
      </label>

      @if (error()) {
        <p class="notice notice-danger" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="button button-primary button-block" [disabled]="busy()">
        {{ busy() ? 'Přihlašuji…' : 'Přihlásit se' }}
      </button>
    </form>

    <p class="auth-links"><a routerLink="/zapomenute-heslo">Zapomenuté heslo</a></p>
  </section>
</main>
