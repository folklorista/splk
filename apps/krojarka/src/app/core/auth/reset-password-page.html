<main class="auth-page">
  <section class="card auth-card">
    <h1 class="auth-title">Nové heslo</h1>

    @if (!token) {
      <p class="notice notice-danger">Odkaz není úplný. Otevřete ho znovu z e-mailu, nebo požádejte o nový.</p>
      <p class="auth-links"><a routerLink="/zapomenute-heslo">Poslat nový odkaz</a></p>
    } @else if (done()) {
      <p class="notice notice-ok" role="status">Heslo je nastavené. Teď se můžete přihlásit.</p>
      <p class="auth-links"><a routerLink="/prihlaseni" class="button button-primary">Přihlásit se</a></p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span>Nové heslo (alespoň {{ minLength }} znaků)</span>
          <input type="password" formControlName="password" autocomplete="new-password" required />
        </label>
        <label class="field">
          <span>Heslo znovu</span>
          <input type="password" formControlName="confirmation" autocomplete="new-password" required />
        </label>
        @if (error()) {
          <p class="notice notice-danger" role="alert">{{ error() }}</p>
        }
        <button type="submit" class="button button-primary button-block" [disabled]="busy()">
          Nastavit heslo
        </button>
      </form>
    }
  </section>
</main>
