<main class="auth-page">
  <section class="card auth-card">
    <h1 class="auth-title">Nastavení hesla</h1>

    @if (sent()) {
      <p class="notice notice-ok" role="status">
        Pokud k e-mailu existuje účet, poslali jsme na něj odkaz pro nastavení hesla. Odkaz platí
        60 minut.
      </p>
    } @else {
      <p class="muted">Pošleme vám e-mailem odkaz, kterým si nastavíte nové heslo.</p>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span>E-mail</span>
          <input type="email" formControlName="email" autocomplete="username" required />
        </label>
        @if (error()) {
          <p class="notice notice-danger" role="alert">{{ error() }}</p>
        }
        <button type="submit" class="button button-primary button-block" [disabled]="busy()">
          Poslat odkaz
        </button>
      </form>
    }

    <p class="auth-links"><a routerLink="/prihlaseni">Zpět na přihlášení</a></p>
  </section>
</main>
