<header class="topbar">
  <button
    type="button"
    class="menu-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="side-menu"
    (click)="menuOpen.set(!menuOpen())"
  >
    Menu
  </button>
  <a routerLink="/" class="brand">Krojařka</a>
</header>

<nav id="side-menu" class="sidebar" [class.open]="menuOpen()" aria-label="Hlavní menu">
  <a routerLink="/" class="brand brand-large">
    Krojařka
    <small>Vonica</small>
  </a>
  @if (mock) {
    <p class="mock-badge">Vývojová data bez serveru</p>
  }
  @if (funds.funds().length > 1) {
    <label class="fund-select">
      <span>Krojový fond</span>
      <select [value]="funds.current()?.unitId" (change)="funds.select(+$any($event.target).value)">
        @for (fund of funds.funds(); track fund.unitId) {
          <option [value]="fund.unitId" [selected]="fund.unitId === funds.current()?.unitId">{{ fund.name }}</option>
        }
      </select>
    </label>
  } @else if (funds.current(); as fund) {
    <p class="fund-select">Krojový fond: <strong>{{ fund.name }}</strong></p>
  }
  <ul>
    @for (item of menu; track item.path) {
      <li>
        <a
          [routerLink]="'/' + item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '' }"
          (click)="menuOpen.set(false)"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
  <div class="user">
    <span>{{ auth.displayName() }}</span>
    <button type="button" class="link-button" (click)="logout()">Odhlásit</button>
  </div>
</nav>

@if (menuOpen()) {
  <div class="backdrop" (click)="menuOpen.set(false)"></div>
}

<main class="content">
  <router-outlet />
</main>
