# Lokální vývojové prostředí (na produkci Docker není)
# Proměnné DB_* jsou jen pro lokální databázi; produkční PG_* z .env se tu záměrně nepoužívají.
name: splk

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_DATABASE: ${DB_NAME:-splk}
      PG_USER: ${DB_USER:-splk}
      PG_PASSWORD: ${DB_PASSWORD:-splk}
      PG_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-splk}
      POSTGRES_USER: ${DB_USER:-splk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-splk}
      # stejné české řazení jako na hostingu (cs_CZ.utf8)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=cs-CZ"
      TZ: Europe/Prague
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pg-data:
