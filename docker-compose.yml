# Lokální vývojové prostředí (na produkci Docker není)
# Proměnné DB_* jsou jen pro lokální databázi; produkční PG_* z .env se tu záměrně nepoužívají.
name: splk

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_DATABASE: ${DB_NAME:-splk}
      PG_USER: ${DB_USER:-splk}
      PG_PASSWORD: ${DB_PASSWORD:-splk}
      PG_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  # API (api/) – Apache + PHP 8.5 serving api/public, code mounted for development.
  # Composer, Phinx and PHPUnit run in the same container: docker compose run --rm api composer …
  api:
    build: ./api
    ports:
      - "8082:80"
    environment:
      SPLK_API_CONFIG: /app/config/config.docker.php
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-splk}
      DB_USER: ${DB_USER:-splk}
      DB_PASSWORD: ${DB_PASSWORD:-splk}
      # e-mails go to the log unless API_MAIL_TRANSPORT=smtp (then sent from krojarka@vonica.cz)
      MAIL_TRANSPORT: ${API_MAIL_TRANSPORT:-log}
      MAIL_SMTP_HOST: ${KROJARKA_EMAIL_SMTP_HOST:-smtp.websupport.cz}
      MAIL_SMTP_PORT: ${KROJARKA_EMAIL_SMTP_PORT:-465}
      MAIL_USERNAME: ${KROJARKA_EMAIL_ADDRESS:-}
      MAIL_PASSWORD: ${KROJARKA_EMAIL_PASSWORD:-}
      # first organization.admin account (seed FirstAdministrator)
      ADMIN_EMAIL: ${API_ADMIN_EMAIL:-}
      ADMIN_FIRST_NAME: ${API_ADMIN_FIRST_NAME:-}
      ADMIN_LAST_NAME: ${API_ADMIN_LAST_NAME:-}
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-splk}
      POSTGRES_USER: ${DB_USER:-splk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-splk}
      # stejné české řazení jako na hostingu (cs_CZ.utf8)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=cs-CZ"
      TZ: Europe/Prague
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pg-data:
